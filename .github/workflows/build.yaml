name: Build and Push

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Set short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: rk90229/cf-tunnel-operator:main-${{ steps.vars.outputs.sha }}

      - name: Update image tags
        run: |
          sed -i "s|image: rk90229/cf-tunnel-operator:.*|image: rk90229/cf-tunnel-operator:main-${{ steps.vars.outputs.sha }}|" deploy/deployment.yaml
          sed -i "s|tag:.*|tag: main-${{ steps.vars.outputs.sha }}|" cf-tunnel-operator/values.yaml

      - name: Commit updated image tags
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add deploy/deployment.yaml
          git add cf-tunnel-operator/values.yaml
          git commit -m "ci: update image to main-${{ steps.vars.outputs.sha }}"
          git pull --rebase origin main
          git push
