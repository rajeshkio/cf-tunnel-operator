apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }} 
  namespace: {{ .Values.namespace }} 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }} 
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }} 
      containers:
        - name: operator
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }} 
          imagePullPolicy: Always
          env:
            - name: CF_SYNC_INTERVAL
              value: {{ .Values.syncInterval | quote }}
            - name: CF_SESSION_DURATION
              value: {{ .Values.sessionDuration | quote }}
            - name: CF_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }} 
                  key: CF_ACCOUNT_ID
            - name: CF_TUNNEL_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }} 
                  key: CF_TUNNEL_ID
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: CF_API_TOKEN
            - name: CF_DNS_ZONE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: CF_DNS_ZONE_ID 
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
